
apiVersion: v1
kind: Namespace
metadata:
  name: quickbite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite
  namespace: quickbite
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quickbite
  template:
    metadata:
      labels:
        app: quickbite
    spec:
      containers:
        - name: quickbite
          image: samikshabhoir43/quickbite:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: quickbite-service
  namespace: quickbite
spec:
  type: NodePort
  selector:
    app: quickbite
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082

